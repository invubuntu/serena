<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bruh</title>
    <!-- Add favicon here -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        /* Styling to replicate iongaf.xyz */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f; /* Dark background */
            color: #ffffff; /* White text */
            font-family: 'Courier New', Courier, monospace; /* Monospaced font */
            position: relative;
            height: 100vh;
            overflow: hidden; /* Prevent scrollbars */
        }

        a {
            position: absolute;
            font-size: 1.5em;
            text-decoration: none;
            color: #00ffff; /* Cyan color for links */
            font-weight: bold;
            transition: color 0.3s;
        }

        a:hover {
            color: #ff00ff; /* Magenta on hover */
        }
    </style>
</head>
<body>
    <script>
        // Array of titles and links
        const titles = [
            { text: "hsurc <3 backward", link: "https://www.youtube.com/watch?v=xvFZjo5PgG0" },
            { text: "GitHub", link: "https://github.com" },
            { text: "YouTube", link: "https://youtube.com" },
            { text: "Wikipedia", link: "https://wikipedia.org" },
            { text: "i wear yo ring bruddah", link: "https://amazon.com" },
            { text: "sweats", link: "https://jadedldn.com/en-us/products/grey-marl-monster-joggers?srsltid=AfmBOooIczyPbUSq9ldo7l_EhvMP5n1cdRhgmPiFbwe2o-RNTGj1BDNM" },
            { text: "gimme that iongaf ball sweater", link: "https://iongaf.xyz" }
            { text: "key", link: "https://sonnyangelusa.com/collections/smiski/products/smiski-key-chain" }
            { text: "hippy", link: "https://sonnyangelusa.com/collections/smiski/products/smiski-hippers" }
            { text: "sern spoti", link: "https://open.spotify.com/user/4q5vuo6phvg2qoeqku0q8sh0r?si=0dd52b17a83b481e" }
        ];

        // Function to generate random positions
        function getRandomPosition(maxWidth, maxHeight) {
            const x = Math.random() * maxWidth;
            const y = Math.random() * maxHeight;
            return { x, y };
        }

        // Place titles randomly on the page
        function placeTitles() {
            const maxWidth = window.innerWidth - 100; // Adjust for title width
            const maxHeight = window.innerHeight - 50; // Adjust for title height

            titles.forEach(title => {
                const linkElement = document.createElement('a');
                linkElement.textContent = title.text;
                linkElement.href = title.link;
                linkElement.target = "_blank"; // Open in a new tab

                // Get random position
                const position = getRandomPosition(maxWidth, maxHeight);
                linkElement.style.left = `${position.x}px`;
                linkElement.style.top = `${position.y}px`;

                document.body.appendChild(linkElement);
            });
        }

        // Initialize titles
        placeTitles();
    </script>
</body>
</html>
